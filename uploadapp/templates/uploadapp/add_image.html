<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Upload" />
      </form>
      <h1>Image link/url: {{ saved_object.image.url }}</h1>
      <h1>Image description: {{ saved_object.description }}</h1>
      <img src="{{ saved_object.image.url }}" alt="image" />
    </div>
  </body>
</html>
